<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<meta name="description" content="Un cielo entero hecho de nosotros.">
<meta property="og:title" content="Escrito en las estrellas ✦">
<meta property="og:description" content="Un regalo hecho de estrellas, solo para ti.">
<title>Escrito en las estrellas ✦</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>✨</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilo.css">

<!-- ════════════════════════════════════════════════════════════════
     ✦  PARA EDITAR FOTOS, MENSAJES Y TEXTOS, ABRE EL ARCHIVO:
          assets/config.js   (es el único archivo que tienes que tocar)
        Las fotos van en la carpeta:  assets/fotos/
═══════════════════════════════════════════════════════════════════ -->
</head>
<body>

<canvas id="cielo" aria-hidden="true"></canvas>
<div id="velo"></div>

<!-- ───────── Carga ───────── -->
<section id="s-carga" class="pantalla" aria-live="polite">
  <div class="carga-astro">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="carga-pista" cx="60" cy="60" r="54"/>
      <circle class="carga-arco" id="carga-arco" cx="60" cy="60" r="54"/>
    </svg>
    <span class="carga-estrella">✦</span>
  </div>
  <p class="carga-texto">Preparando tu cielo <span id="carga-pct">0%</span></p>
</section>

<!-- ───────── Portada ───────── -->
<section id="s-inicio" class="pantalla">
  <div class="luna-marco">
    <svg class="luna-anillo" viewBox="0 0 300 300" aria-hidden="true">
      <defs><path id="circulo" d="M150,150 m-132,0 a132,132 0 1,1 264,0 a132,132 0 1,1 -264,0"/></defs>
      <text><textPath href="#circulo" id="luna-texto"></textPath></text>
    </svg>
    <div class="luna-halo"></div>
    <div class="luna"><img id="luna-img" alt=""></div>
    <span class="luna-chispa c1">✦</span><span class="luna-chispa c2">✧</span><span class="luna-chispa c3">✦</span>
  </div>
  <p class="inicio-para" id="inicio-para"></p>
  <h1 class="inicio-titulo" id="inicio-titulo"></h1>
  <p class="inicio-sub" id="inicio-sub"></p>
  <button class="boton" id="btn-empezar" type="button"><span>Mirar al cielo</span><i aria-hidden="true">✦</i></button>
  <p class="inicio-nota">Sube el volumen · ponte cómoda</p>
</section>

<!-- ───────── Prólogo ───────── -->
<section id="s-prologo" class="pantalla captura">
  <p class="prologo-linea" id="prologo-linea"></p>
  <p class="prologo-toca">toca para continuar</p>
  <button class="boton-texto prologo-saltar" id="btn-saltar" type="button">Saltar ›</button>
</section>

<!-- ───────── Cielo ───────── -->
<section id="s-cielo" class="pantalla">
  <header class="hud" id="hud">
    <div class="hud-contador" aria-live="polite">
      <span class="hud-num"><b id="hud-n">0</b><i>/</i><span id="hud-t">20</span></span>
      <span class="hud-label" id="hud-label">estrellas encendidas</span>
      <span class="hud-barra"><span id="hud-barra"></span></span>
    </div>
  </header>
  <div class="hud-abajo">
    <p class="hud-pista" id="hud-pista"></p>
    <button class="boton oculto" id="btn-ver-final" type="button"><span>Ver nuestro final</span><i aria-hidden="true">✦</i></button>
  </div>
</section>

<!-- ───────── Final ───────── -->
<section id="s-final" class="pantalla">
  <p class="final-frase" id="final-frase"></p>
  <div class="mosaico" id="mosaico"></div>
  <div class="final-abajo">
    <button class="boton oculto" id="btn-carta" type="button"><span>Leer la carta que te escribí</span><i aria-hidden="true">✉</i></button>
  </div>
</section>

<!-- ───────── Carta ───────── -->
<section id="s-carta" class="pantalla">
  <article class="carta" id="carta">
    <div class="carta-fotos" id="carta-fotos"></div>
    <h2 class="carta-titulo" id="carta-titulo"></h2>
    <div class="carta-texto" id="carta-texto"></div>
    <div class="contador oculto" id="contador">
      <p class="contador-label">Llevamos juntos</p>
      <div class="contador-cajas">
        <div><b id="c-dias">0</b><span>días</span></div>
        <div><b id="c-horas">0</b><span>horas</span></div>
        <div><b id="c-min">0</b><span>minutos</span></div>
        <div><b id="c-seg">0</b><span>segundos</span></div>
      </div>
    </div>
    <p class="carta-firma" id="carta-firma"></p>
    <div class="carta-acciones">
      <button class="boton" id="btn-volver-cielo" type="button"><span>Volver al cielo</span><i aria-hidden="true">✦</i></button>
      <button class="boton-texto" id="btn-reiniciar" type="button">Empezar de nuevo</button>
    </div>
  </article>
</section>

<!-- ───────── Recuerdo (al tocar una estrella) ───────── -->
<div id="recuerdo" class="recuerdo" role="dialog" aria-modal="true" aria-labelledby="rc-titulo" hidden>
  <div class="rc-fondo" id="rc-fondo"></div>
  <article class="rc-tarjeta" id="rc-tarjeta">
    <div class="rc-foto" id="rc-foto">
      <img class="rc-foto-bg" id="rc-bg" alt="">
      <img class="rc-foto-img" id="rc-img" alt="">
      <span class="rc-brillo" id="rc-brillo"></span>
      <button class="rc-cerrar" id="rc-cerrar" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="rc-cuerpo" id="rc-cuerpo">
      <p class="rc-num" id="rc-num"></p>
      <h2 class="rc-titulo" id="rc-titulo"></h2>
      <div class="rc-sep" id="rc-sep"><span></span><i>✦</i><span></span></div>
      <p class="rc-msg" id="rc-msg"></p>
      <div class="rc-acciones" id="rc-acciones">
        <button class="boton-sec" id="rc-volver" type="button">Volver al cielo</button>
        <button class="boton" id="rc-sig" type="button"><span>Encender la siguiente</span><i aria-hidden="true">✦</i></button>
      </div>
    </div>
  </article>
</div>

<!-- ───────── Avisos ───────── -->
<div id="deseo" class="deseo" role="status">
  <span class="deseo-ico" aria-hidden="true">☄</span>
  <div><b>Pediste un deseo</b><p id="deseo-texto"></p></div>
</div>
<div id="aviso" class="aviso" role="status"></div>

<button id="btn-musica" class="btn-musica oculto" type="button" aria-label="Pausar música">
  <span class="ecualizador" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>

<div id="fatal" class="fatal">
  No se pudo cargar el regalo.<br>
  Abre <b>index.html</b> manteniendo la carpeta <b>assets</b> a su lado.
</div>

<script src="assets/lib/gsap.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/js/sonido.js"></script>
<script src="assets/js/cielo.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
